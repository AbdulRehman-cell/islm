services:
  # Web Service: Express Server hosting API & static frontend files
  - type: web
    name: islm-production-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        value: mongodb://islm-mongodb:27017/islm
      - key: CLIENT_URL
        value: https://islm-production-app.onrender.com

  # Private Service: MongoDB instance with disk storage for persistence
  - type: private
    name: islm-mongodb
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: ./mongodb-render
    plan: starter
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1