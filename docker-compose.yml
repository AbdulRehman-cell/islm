version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: islm-app
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - MONGO_URI=mongodb://mongodb:27017/islm
      - JWT_SECRET=super_secret_dev_key_change_me_in_prod_123456
      - CLIENT_URL=http://localhost:10000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:6.0.14-jammy
    container_name: islm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data: